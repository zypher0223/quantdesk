name: quantdesk

services:
  engine:
    build:
      context: ./engine
      args:
        TRADINGAGENTS_COMMIT: be952b8eccb49720509af544c6675233bc1f10d0
    environment:
      QUANTDESK_HOME: /data
      QUANTDESK_PROXY: ${QUANTDESK_PROXY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
    volumes:
      - quantdesk_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=5)"]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./web
    ports:
      - "${QUANTDESK_PORT:-8080}:80"
    environment:
      QUANTDESK_USER: ${QUANTDESK_USER:-quantdesk}
      QUANTDESK_PASSWORD: ${QUANTDESK_PASSWORD:?请在 .env 设置 QUANTDESK_PASSWORD}
    depends_on:
      engine:
        condition: service_healthy
    restart: unless-stopped

volumes:
  quantdesk_data:

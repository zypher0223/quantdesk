# "upgrade" only when the client actually asked for it, "close" otherwise.
# `map` belongs to the http context, which is where this include is read from.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    auth_basic "QuantDesk";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location /api/ {
        proxy_pass http://engine:8765;
        proxy_http_version 1.1;
        # Long enough for a reasoning-model research pass, and long enough that
        # the market stream idles only on its own 20s heartbeat.
        proxy_read_timeout 1900s;
        proxy_send_timeout 1900s;

        # /api/market/stream is a WebSocket: without the upgrade headers nginx
        # answers the handshake itself and the page silently loses its live feed.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    location /bybit/ {
        proxy_pass http://engine:8765;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://engine:8765/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

[project]
name = "quantdesk"
version = "0.1.0"
description = "QuantDesk — 量化交易工作台引擎（数据/共振/回测/模拟盘/TradingAgents 集成）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "httpx>=0.27",
    "pandas>=2.2",
    "stockstats>=0.6.2",
    "pydantic>=2.8",
    "tomli-w>=1.0",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "yfinance>=0.2.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
quantdesk = "quantdesk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantdesk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
